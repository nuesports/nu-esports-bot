name: Discord Backlog Hooks

# Notifies #pr-backlog and #issue-backlog whenever a PR or issue is opened.
#
# PRs use pull_request_target (not pull_request) so the webhook secret is
# available even for PRs from forks. This is safe here because the script
# only ever reads payload metadata (title/body/user) as data - it never
# checks out or executes anything from the PR.
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  pr-backlog:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #pr-backlog
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_BACKLOG_WEBHOOK }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            // Matches GitHub's own closing keywords: closes/fixes/resolves #N
            const closingRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = [...new Set([...body.matchAll(closingRe)].map((m) => Number(m[1])))];

            const formatList = (items) => {
              if (items.length === 1) return items[0];
              if (items.length === 2) return `${items[0]} and ${items[1]}`;
              return `${items.slice(0, -1).join(", ")}, and ${items[items.length - 1]}`;
            };

            const repoUrl = context.payload.repository.html_url;
            let closesText = "";
            if (issueNumbers.length > 0) {
              const links = issueNumbers.map((n) => `[${n}](${repoUrl}/issues/${n})`);
              closesText = `, closes issue ${formatList(links)}`;
            }

            const message = `pr [${pr.number}](${pr.html_url}), ${pr.title}${closesText}. author [${pr.user.login}](${pr.user.html_url})`;

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: message }),
            });

  issue-backlog:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #issue-backlog
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ISSUE_BACKLOG_WEBHOOK }}
        with:
          script: |
            const issue = context.payload.issue;

            const message = `issue [${issue.number}](${issue.html_url}), ${issue.title}. author [${issue.user.login}](${issue.user.html_url})`;

            await fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: message }),
            });
