name: Mypy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      # Matches the pre-commit hook: same pinned mypy, same config from pyproject.
      - run: uvx --python 3.14 mypy@2.3.1
