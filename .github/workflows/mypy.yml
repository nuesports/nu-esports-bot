name: Mypy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.10"
      # Matches the pre-commit hook: same pinned mypy, same config from pyproject.
      - run: uvx mypy@2.3.1
