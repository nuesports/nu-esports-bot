name: Ruff

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version pinned to match .pre-commit-config.yaml, so a local run can't
      # pass something CI rejects.
      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.5
      - name: Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.16.5
          args: "format --check --diff"
