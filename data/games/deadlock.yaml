roles: []

# Alternate spellings accepted for /profile set main, mapped to the canonical
# characters entry -- e.g. Valve's official name is "The Doorman", but people
# will keep typing "Doorman" out of habit.
aliases:
  Doorman: The Doorman

tiers: [Initiate, Seeker, Acolyte, Sentinel, Mystic, Ritualist, Emissary, Oracle, Phantom, Ascendant, Eternus]
divisions: 6
no_division_tiers: [] # Tiers that aren't divisioned, like Challenger in League
lobby_size: 12

# Non-linear per-tier base points used to seed elo from rank (see utils/elo.py).
# Gaps widen at the top to reflect that Diamond->Master is a much bigger real skill
# jump than Iron->Bronze, even though both are "one tier." Tune freely.
rank_points:
  Initiate: 0
  Seeker: 300
  Acolyte: 600
  Sentinel: 900
  Mystic: 1300
  Ritualist: 1700
  Emissary: 2300
  Oracle: 3100
  Phantom: 3800
  Ascendant: 4600
  Eternus: 6000

divisions_ascend:
  true # lowest in a division is 1, highest is 6

# Seed elo for players who never set a rank. Deliberately below the club's
# average so a wrong guess corrects upward instead of stomping lobbies.
default_tier: Sentinel

