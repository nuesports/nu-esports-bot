roles: [Tank, Damage, Support, Flex]
tiers: [Bronze, Silver, Gold, Platinum, Diamond, Master, Grandmaster, Ultimate, Top 500]
divisions: 5
no_division_tiers: [Top 500]
lobby_size: 10

# Non-linear per-tier base points used to seed elo from rank (see utils/elo.py).
rank_points:
  Bronze: 0
  Silver: 350
  Gold: 750
  Platinum: 1200
  Diamond: 1700
  Master: 2300
  Grandmaster: 3000
  Ultimate: 3800
  Top 500: 4700

divisions_ascend:
  false

# Seed elo for players who never set a rank. Deliberately below the club's
# average so a wrong guess corrects upward instead of stomping lobbies.
default_tier: Gold

role_requirements:
  Tank: 1
  Damage: 2
  Support: 2

# Ranks (and elo) are tracked separately per role instead of one per game.
per_role_ranks: true

# Shown next to a player's name on the mixed (no-role) leaderboard, marking which
# role their displayed (best) elo came from.
role_icons:
  Tank: 🛡️
  Damage: ⚔️
  Support: ➕

