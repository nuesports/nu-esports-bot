repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.5
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
# Type check. Runs on the whole project (mypy needs the full import graph, so
# per-file checking gives wrong answers) -- pass_filenames is off for that reason.
- repo: local
  hooks:
    - id: mypy
      name: mypy
      entry: uvx mypy@2.3.1
      language: system
      types: [python]
      pass_filenames: false
