discord:
  token: #<token>
  guild_id: #<guild_id>
database:
  host: db
  port: 5432
  dbname: nu-esports-bot
  user: bot
  password: supersecurepassword
apis:
  ggleap: # link here
  apify-key: # key here
  riot-api-key: # RGAPI-... key here
  steam-api-key: # free key from https://steamcommunity.com/dev/apikey
