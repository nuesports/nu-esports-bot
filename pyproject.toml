[project]
name = "nu-esports-bot"
version = "0.1.0"
description = "Northwestern Esports Discord Bot"
requires-python = ">=3.14"
dependencies = [
    "py-cord==2.8.1",
    "pyyaml==6.0.3",
    "psycopg[binary,pool]==3.3.5",
    "pillow==12.3.0",
    "aiohttp==3.14.3",
    "emoji>=2.15.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
# One shared event loop for the whole session, not one per test. Needed so the
# session-scoped DB pool (opened once in the migrated_db fixture) stays valid for
# every test that uses it -- an async connection pool can't be reused across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


[tool.mypy]
# Must track requires-python. ruff format emits 3.14 syntax (PEP 758's
# unparenthesized `except A, B:`, PEP 695's `type` statement), which mypy can
# only parse when it is *running* on 3.14 -- hence `uvx --python 3.14` in both
# the pre-commit hook and mypy.yml. This setting alone is not enough.
python_version = "3.14"
files = ["cogs", "utils"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff.lint.flake8-bugbear]
# discord.Option() in an argument default is py-cord's declarative option syntax,
# read once at command registration -- not a mutable default shared between calls.
extend-immutable-calls = ["discord.Option"]

[tool.ruff.lint]
# ANN: every function needs annotated parameters and a return type.
extend-select = ["ANN"]
# Parsed JSON from an external API genuinely has no static shape.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are uniformly `-> None` taking fixtures; annotating them is noise.
"tests/*" = ["ANN"]
