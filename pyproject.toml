[project]
name = "nu-esports-bot"
version = "0.1.0"
description = "Northwestern Esports Discord Bot"
requires-python = ">=3.10"
dependencies = [
    "py-cord==2.6.1",
    "pyyaml==6.0.2",
    "psycopg[binary,pool]==3.2.6",
    "pillow==10.4.0",
    "aiohttp==3.14.3",
    "emoji>=2.15.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
# One shared event loop for the whole session, not one per test. Needed so the
# session-scoped DB pool (opened once in the migrated_db fixture) stays valid for
# every test that uses it -- an async connection pool can't be reused across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

